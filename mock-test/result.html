<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পরীক্ষার ফলাফল | WB ANM GNM 2026</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="css/analysis.css">
</head>
<body>

  <header class="result-header" role="banner">
    <button class="back-btn" id="backBtn" aria-label="মক টেস্ট তালিকায় ফিরুন">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>পরীক্ষার ফলাফল</h1>
    <button class="print-btn" id="printBtn" aria-label="ফলাফল প্রিন্ট করুন"
            title="প্রিন্ট করুন">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2
                 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
    </button>
  </header>

  <!-- Loading State -->
  <div class="result-loading" id="resultLoading" role="status" aria-live="polite">
    <div class="loading-spinner"></div>
    <p>ফলাফল লোড হচ্ছে...</p>
  </div>

  <!-- Error State -->
  <div class="result-error hidden" id="resultError" role="alert">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
         stroke="#f44336" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p id="resultErrorMessage">ফলাফল পাওয়া যায়নি।</p>
    <button class="btn btn-primary" onclick="window.location.href='./index.html'">
      মক টেস্টে ফিরুন
    </button>
  </div>

  <!-- Result Content -->
  <main class="result-container hidden" id="resultContent" role="main">

    <!-- Overall Score Section -->
    <section class="overall-score" aria-label="মোট স্কোর">
      <div class="score-display">

        <div class="circular-progress" id="scoreCircle" aria-label="স্কোর চার্ট">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="52" class="progress-bg"/>
            <circle cx="60" cy="60" r="52" class="progress-fill"
                    id="progressFill"/>
          </svg>
          <div class="score-text">
            <span class="score-number" id="totalScore">0</span>
            <span class="score-max" id="scoreMax">/115</span>
          </div>
        </div>

        <div class="score-details">

          <div class="score-item">
            <span class="score-label">শতাংশ</span>
            <strong class="score-value" id="percentage">0%</strong>
          </div>

          <div class="score-item">
            <span class="score-label">Category-1 স্কোর</span>
            <strong class="score-value" id="cat1ScoreDisplay">0 / 85</strong>
          </div>

          <div class="score-item">
            <span class="score-label">Category-2 স্কোর</span>
            <strong class="score-value" id="cat2ScoreDisplay">0 / 30</strong>
          </div>

          <div class="score-item">
            <span class="score-label">সময় লেগেছে</span>
            <strong class="score-value" id="timeTaken">--:--</strong>
          </div>

          <div class="score-item">
            <span class="score-label">সঠিক উত্তর</span>
            <strong class="score-value text-success" id="correctCount">0</strong>
          </div>

          <div class="score-item">
            <span class="score-label">ভুল উত্তর</span>
            <strong class="score-value text-danger" id="wrongCount">0</strong>
          </div>

        </div>
      </div>

      <!-- Performance Banner -->
      <div class="performance-banner" id="performanceBanner">
        <span id="performanceText">ফলাফল বিশ্লেষণ হচ্ছে...</span>
      </div>
    </section>

    <!-- Subject Analysis Section -->
    <section class="subject-analysis" aria-label="বিষয়ভিত্তিক বিশ্লেষণ">
      <h2>বিষয়ভিত্তিক বিশ্লেষণ</h2>
      <div class="analysis-grid" id="subjectAnalysis">
        <!-- Generated by result-app.js -->
      </div>
    </section>

    <!-- Question Review Section -->
    <section class="question-review" aria-label="প্রশ্ন পর্যালোচনা">
      <h2>প্রশ্ন পর্যালোচনা</h2>

      <div class="review-filters" role="group" aria-label="ফিল্টার করুন">
        <button class="filter-btn active" data-filter="all"
                aria-pressed="true">সব (100)</button>
        <button class="filter-btn" data-filter="correct"
                aria-pressed="false">সঠিক (<span id="correctFilterCount">0</span>)</button>
        <button class="filter-btn" data-filter="wrong"
                aria-pressed="false">ভুল (<span id="wrongFilterCount">0</span>)</button>
        <button class="filter-btn" data-filter="unattempted"
                aria-pressed="false">উত্তর করেননি (<span id="unattemptedFilterCount">0</span>)</button>
      </div>

      <div class="review-list" id="reviewList" aria-live="polite">
        <!-- Generated by result-app.js -->
      </div>

      <div class="review-empty hidden" id="reviewEmpty">
        <p>এই ফিল্টারে কোনো প্রশ্ন নেই।</p>
      </div>
    </section>

    <!-- Action Buttons -->
    <div class="action-buttons" role="group" aria-label="পরবর্তী পদক্ষেপ">
      <button class="btn btn-outline" id="retryBtn"
              aria-label="এই পরীক্ষা আবার দিন">আবার চেষ্টা করুন</button>
      <button class="btn btn-outline" id="anotherBtn"
              aria-label="অন্য মক টেস্ট বেছে নিন">অন্য মক টেস্ট</button>
      <button class="btn btn-primary" id="homeBtn"
              aria-label="হোমে ফিরুন">হোমে ফিরুন</button>
    </div>

  </main>

  <script src="js/mock-storage.js"></script>
  <script src="js/mock-scorer.js"></script>
  <script src="js/mock-print.js"></script>
  <script src="js/result-app.js"></script>

</body>
</html>
