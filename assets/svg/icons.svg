<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg — SVG Icon Sprite
  WB ANM GNM 2026 Preparation Platform

  Usage:
    <svg aria-hidden="true" focusable="false">
      <use href="/assets/svg/icons.svg#book"></use>
