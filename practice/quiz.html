<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WB ANM GNM 2026 অনুশীলন কুইজ" />
  <title>কুইজ | WB ANM GNM 2026</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/utilities.css" />
  <link rel="stylesheet" href="css/practice-layout.css" />
  <link rel="stylesheet" href="css/quiz-interface.css" />
</head>

<body class="quiz-body">

  <!-- ========== QUIZ HEADER ========== -->
  <header class="quiz-header" role="banner" id="quiz-header">
    <div class="quiz-header__inner">

      <!-- Left: Back + Subject info -->
      <div class="quiz-header__left">
        <a
          href="index.html"
          class="back-btn back-btn--quiz"
          id="back-btn"
          aria-label="অনুশীলন তালিকায় ফিরুন"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span class="back-btn__text">ফিরুন</span>
        </a>

        <div class="quiz-header__info">
          <span class="quiz-header__subject" id="header-subject">
            বিষয় লোড হচ্ছে...
          </span>
          <span class="quiz-header__set" id="header-set">সেট —</span>
        </div>
      </div>

      <!-- Center: Progress indicator -->
      <div class="quiz-header__center" aria-live="polite" aria-atomic="true">
        <span class="quiz-progress-text" id="progress-text">
          ০ / ২০
        </span>
        <div class="quiz-progress-mini" aria-hidden="true">
          <div
            class="quiz-progress-mini__fill"
            id="progress-mini-fill"
            style="width: 0%"
          ></div>
        </div>
      </div>

      <!-- Right: Timer -->
      <div class="quiz-header__right">
        <div
          class="quiz-timer"
          id="quiz-timer"
          role="timer"
          aria-label="অতিবাহিত সময়"
          aria-live="off"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="timer-display">০০:০০</span>
        </div>

        <!-- Mobile palette toggle -->
        <button
          class="palette-toggle-btn"
          id="palette-toggle-btn"
          type="button"
          aria-label="প্রশ্ন তালিকা দেখুন"
          aria-expanded="false"
          aria-controls="question-palette"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <rect x="3"  y="3"  width="7" height="7"/>
            <rect x="14" y="3"  width="7" height="7"/>
            <rect x="3"  y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ========== LAYOUT WRAPPER ========== -->
  <div class="quiz-layout" id="quiz-layout">

    <!-- ========== QUESTION PALETTE (Sidebar / Bottom Sheet) ========== -->
    <nav
      class="question-palette"
      id="question-palette"
      aria-label="প্রশ্ন নেভিগেশন"
      role="navigation"
    >
      <div class="palette-header">
        <h2 class="palette-title">প্রশ্ন তালিকা</h2>
        <button
          class="palette-close-btn"
          id="palette-close-btn"
          type="button"
          aria-label="তালিকা বন্ধ করুন"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6"  y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Number grid -->
      <div
        class="palette-grid"
        id="palette-grid"
        role="list"
        aria-label="প্রশ্ন নম্বর"
      >
        <!-- Injected by quiz-engine.js -->
      </div>

      <!-- Palette legend -->
      <div class="palette-legend" role="list" aria-label="রঙের ব্যাখ্যা">
        <div class="palette-legend__item" role="listitem">
          <span class="palette-dot palette-dot--current"  aria-hidden="true"></span>
          বর্তমান
        </div>
        <div class="palette-legend__item" role="listitem">
          <span class="palette-dot palette-dot--answered" aria-hidden="true"></span>
          উত্তর দেওয়া
        </div>
        <div class="palette-legend__item" role="listitem">
          <span class="palette-dot palette-dot--unanswered" aria-hidden="true"></span>
          বাকি
        </div>
      </div>

      <!-- Submit from sidebar -->
      <button
        class="btn btn-submit-side"
        id="sidebar-submit-btn"
        type="button"
        aria-label="কুইজ জমা দিন"
        hidden
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        কুইজ জমা দিন
      </button>
    </nav>

    <!-- Palette backdrop (mobile) -->
    <div
      class="palette-backdrop"
      id="palette-backdrop"
      aria-hidden="true"
    ></div>

    <!-- ========== MAIN QUIZ AREA ========== -->
    <main class="quiz-main" id="quiz-main" role="main">

      <!-- Loading state -->
      <div
        class="quiz-loading"
        id="quiz-loading"
        role="status"
        aria-live="polite"
      >
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>প্রশ্নগুলি লোড হচ্ছে...</span>
      </div>

      <!-- Error state -->
      <div
        class="quiz-error"
        id="quiz-error"
        role="alert"
        aria-live="assertive"
        hidden
      >
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
          stroke="#ef4444" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8"  x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p id="quiz-error-msg">প্রশ্ন লোড করতে সমস্যা হয়েছে।</p>
        <a href="index.html" class="btn btn-primary">
          অনুশীলন পাতায় ফিরুন
        </a>
      </div>

      <!-- Question card -->
      <div
        class="question-card"
        id="question-card"
        role="region"
        aria-label="প্রশ্ন"
        hidden
      >

        <!-- Question badge + text -->
        <div class="question-card__header">
          <div class="question-badge" id="question-badge" aria-hidden="true">
            প্রশ্ন <span id="question-number">১</span>
          </div>
          <div class="question-marks-badge" aria-label="নম্বর বণ্টন">
            <span class="mark-correct">+১</span>
            <span class="mark-wrong">−০.২৫</span>
          </div>
        </div>

        <div
          class="question-text"
          id="question-text"
          role="heading"
          aria-level="2"
        >
          <!-- Question text injected by JS -->
        </div>

        <!-- Options -->
        <div
          class="options-list"
          id="options-list"
          role="radiogroup"
          aria-label="উত্তর বিকল্প"
        >
          <!-- Option cards injected by JS -->
        </div>

        <!-- Explanation (shown after review mode) -->
        <div
          class="explanation-box"
          id="explanation-box"
          aria-live="polite"
          hidden
        >
          <div class="explanation-box__header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8"  x2="12" y2="8"/>
              <line x1="12" y1="12" x2="12" y2="16"/>
            </svg>
            <strong>ব্যাখ্যা</strong>
          </div>
          <p class="explanation-box__text" id="explanation-text"></p>
        </div>

      </div>

      <!-- ========== NAVIGATION BAR ========== -->
      <div
        class="quiz-nav"
        id="quiz-nav"
        role="navigation"
        aria-label="প্রশ্ন নেভিগেশন"
        hidden
      >

        <!-- Previous -->
        <button
          class="nav-btn nav-btn--prev"
          id="btn-prev"
          type="button"
          aria-label="আগের প্রশ্ন"
          disabled
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          আগের
        </button>

        <!-- Center: Submit button -->
        <button
          class="nav-btn nav-btn--submit"
          id="btn-submit"
          type="button"
          aria-label="কুইজ জমা দিন"
          hidden
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          জমা দিন
        </button>

        <!-- Question counter (center) -->
        <div
          class="nav-counter"
          id="nav-counter"
          aria-hidden="true"
        >
          <span id="nav-current">১</span>
          <span class="nav-counter__sep">/</span>
          <span id="nav-total">২০</span>
        </div>

        <!-- Next -->
        <button
          class="nav-btn nav-btn--next"
          id="btn-next"
          type="button"
          aria-label="পরবর্তী প্রশ্ন"
        >
          পরবর্তী
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>

      </div>

    </main>

  </div><!-- /.quiz-layout -->

  <!-- ========== SUBMIT CONFIRMATION DIALOG ========== -->
  <div
    class="confirm-overlay"
    id="confirm-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    hidden
  >
    <div class="confirm-box" id="confirm-box">
      <div class="confirm-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
          stroke="#f59e0b" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94
                   a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9"  x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>

      <h2 class="confirm-title" id="confirm-title">
        কুইজ জমা দিবেন?
      </h2>

      <div class="confirm-stats" id="confirm-stats">
        <!-- Injected by JS: answered/unanswered count -->
      </div>

      <p class="confirm-note">
        জমা দেওয়ার পরে উত্তর পরিবর্তন করা যাবে না।
      </p>

      <div class="confirm-actions">
        <button
          class="btn btn-cancel"
          id="confirm-cancel-btn"
          type="button"
        >
          বাতিল
        </button>
        <button
          class="btn btn-confirm-submit"
          id="confirm-submit-btn"
          type="button"
        >
          হ্যাঁ, জমা দিন
        </button>
      </div>
    </div>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="js/quiz-storage.js"></script>
  <script src="js/quiz-scorer.js"></script>
  <script src="js/quiz-engine.js"></script>

</body>
</html>
