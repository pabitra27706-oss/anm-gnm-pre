<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WB ANM GNM 2026 অনুশীলন কুইজ" />
  <title>কুইজ | WB ANM GNM 2026</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/utilities.css" />
  <link rel="stylesheet" href="css/practice-layout.css" />
  <link rel="stylesheet" href="css/quiz-interface.css" />

  <style>
    /* ═══════════════════════════════════════════
       MULTI-CORRECT QUESTION STYLES (NEW)
    ═══════════════════════════════════════════ */

    /* Warning banner shown above options for multi questions */
    .multi-warning {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .multi-warning svg {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      stroke: #1565c0;
    }

    /* Badge shown in question header for multi questions */
    .badge-multi {
      background: #1976d2;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-multi svg {
      width: 11px;
      height: 11px;
      stroke: white;
    }

    /* Marks badge — updated to show multi scoring too */
    .question-marks-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .question-marks-badge.is-multi .mark-correct {
      display: none; /* hide single +1 */
    }
    .mark-multi {
      display: none;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
      border: 1px solid #90caf9;
    }
    .question-marks-badge.is-multi .mark-multi {
      display: inline-block;
    }

    /* Checkbox option — blue accent */
    .option-label input[type="checkbox"] {
      accent-color: #1976d2;
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Checked checkbox option highlight */
    .option-label:has(input[type="checkbox"]:checked) {
      border-color: #1976d2;
      background: #e3f2fd;
    }

    /* Radio option — keep existing but ensure consistency */
    .option-label input[type="radio"] {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Options list role update for multi */
    .options-list[aria-label="উত্তর বিকল্প (একাধিক সঠিক)"] {
      /* Slightly different visual cue for multi group */
      border-left: 3px solid #1976d2;
      padding-left: 4px;
      border-radius: 0 8px 8px 0;
    }

    /* Partial score display in review mode */
    .partial-score {
      color: #ff9800;
      font-size: 12px;
      font-weight: 600;
    }

    /* Score breakdown for multi in review */
    .score-multi {
      border-left: 3px solid #1976d2;
      padding-left: 8px;
      margin: 4px 0;
      font-size: 13px;
      color: #555;
    }

    /* Correct option highlight in review mode */
    .option-label--correct {
      border-color: #4caf50 !important;
      background: #e8f5e9 !important;
    }
    .option-label--wrong {
      border-color: #f44336 !important;
      background: #ffebee !important;
    }
    .option-label--missed {
      border-color: #ff9800 !important;
      background: #fff3e0 !important;
    }

    /* Question card header layout */
    .question-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .question-card__header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Unit/type info line below question text */
    .question-meta {
      font-size: 11px;
      color: #9e9e9e;
      margin-bottom: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .question-meta__tag {
      background: #f5f5f5;
      border-radius: 4px;
      padding: 1px 6px;
    }

    /* Difficulty badges */
    .badge-difficulty {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: 600;
    }
    .badge-difficulty--easy   { background: #e8f5e9; color: #388e3c; }
    .badge-difficulty--medium { background: #fff8e1; color: #f57f17; }
    .badge-difficulty--hard   { background: #ffebee; color: #c62828; }

    /* Confirm dialog stats — multi breakdown */
    .confirm-stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
      color: #555;
    }
    .confirm-stats-row:last-child { border-bottom: none; }
    .confirm-stats-row strong { color: #333; }

    /* Answered count highlight */
    .confirm-answered-count { color: #4caf50; font-weight: 700; }
    .confirm-unanswered-count { color: #f44336; font-weight: 700; }
    .confirm-multi-count { color: #1976d2; font-weight: 700; }
  </style>
</head>

<body class="quiz-body">

  <!-- ========== QUIZ HEADER ========== -->
  <header class="quiz-header" role="banner" id="quiz-header">
    <div class="quiz-header__inner">

      <!-- Left: Back + Subject info -->
      <div class="quiz-header__left">
        <a
          href="index.html"
          class="back-btn back-btn--quiz"
          id="back-btn"
          aria-label="অনুশীলন তালিকায় ফিরুন"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span class="back-btn__text">ফিরুন</span>
        </a>

        <div class="quiz-header__info">
          <!-- Subject name shown in Bengali from manifest -->
          <span class="quiz-header__subject" id="header-subject">
            বিষয় লোড হচ্ছে...
          </span>
          <span class="quiz-header__set" id="header-set">সেট —</span>
        </div>
      </div>

      <!-- Center: Progress indicator -->
      <div class="quiz-header__center" aria-live="polite" aria-atomic="true">
        <span class="quiz-progress-text" id="progress-text">
          ০ / ০
        </span>
        <div class="quiz-progress-mini" aria-hidden="true">
          <div
            class="quiz-progress-mini__fill"
            id="progress-mini-fill"
            style="width: 0%"
          ></div>
        </div>
      </div>

      <!-- Right: Timer + palette toggle -->
      <div class="quiz-header__right">
        <div
          class="quiz-timer"
          id="quiz-timer"
          role="timer"
          aria-label="অতিবাহিত সময়"
          aria-live="off"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="timer-display">০০:০০</span>
        </div>

        <!-- Mobile palette toggle -->
        <button
          class="palette-toggle-btn"
          id="palette-toggle-btn"
          type="button"
          aria-label="প্রশ্ন তালিকা দেখুন"
          aria-expanded="false"
          aria-controls="question-palette"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <rect x="3"  y="3"  width="7" height="7"/>
            <rect x="14" y="3"  width="7" height="7"/>
            <rect x="3"  y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ========== LAYOUT WRAPPER ========== -->
  <div class="quiz-layout" id="quiz-layout">

    <!-- ========== QUESTION PALETTE ========== -->
    <nav
      class="question-palette"
      id="question-palette"
      aria-label="প্রশ্ন নেভিগেশন"
      role="navigation"
    >
      <div class="palette-header">
        <h2 class="palette-title">প্রশ্ন তালিকা</h2>
        <button
          class="palette-close-btn"
          id="palette-close-btn"
          type="button"
          aria-label="তালিকা বন্ধ করুন"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6"  y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Number grid — injected by quiz-engine.js -->
      <!-- Each button gets data-question-id="<string-id>" (NEW: string IDs) -->
      <div
        class="palette-grid"
        id="palette-grid"
        role="list"
        aria-label="প্রশ্ন নম্বর"
      >
        <!-- Injected by quiz-engine.js -->
      </div>

      <!-- Palette legend -->
      <div class="palette-legend" role="list" aria-label="রঙের ব্যাখ্যা">
        <div class="palette-legend__item" role="listitem">
          <span class="palette-dot palette-dot--current"   aria-hidden="true"></span>
          বর্তমান
        </div>
        <div class="palette-legend__item" role="listitem">
          <span class="palette-dot palette-dot--answered"  aria-hidden="true"></span>
          উত্তর দেওয়া
        </div>
        <div class="palette-legend__item" role="listitem">
          <span class="palette-dot palette-dot--unanswered" aria-hidden="true"></span>
          বাকি
        </div>
        <!-- NEW: multi-correct legend item -->
        <div class="palette-legend__item" role="listitem">
          <span class="palette-dot" aria-hidden="true"
            style="background:#1976d2;border-color:#1976d2;"></span>
          বহু-সঠিক
        </div>
      </div>

      <!-- Submit from sidebar -->
      <button
        class="btn btn-submit-side"
        id="sidebar-submit-btn"
        type="button"
        aria-label="কুইজ জমা দিন"
        hidden
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        কুইজ জমা দিন
      </button>
    </nav>

    <!-- Palette backdrop (mobile) -->
    <div
      class="palette-backdrop"
      id="palette-backdrop"
      aria-hidden="true"
    ></div>

    <!-- ========== MAIN QUIZ AREA ========== -->
    <main class="quiz-main" id="quiz-main" role="main">

      <!-- Loading state -->
      <div
        class="quiz-loading"
        id="quiz-loading"
        role="status"
        aria-live="polite"
      >
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>প্রশ্নগুলি লোড হচ্ছে...</span>
      </div>

      <!-- Error state -->
      <div
        class="quiz-error"
        id="quiz-error"
        role="alert"
        aria-live="assertive"
        hidden
      >
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
          stroke="#ef4444" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8"  x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p id="quiz-error-msg">প্রশ্ন লোড করতে সমস্যা হয়েছে।</p>
        <a href="index.html" class="btn btn-primary">
          অনুশীলন পাতায় ফিরুন
        </a>
      </div>

      <!-- ══════════════════════════════════════
           QUESTION CARD
           Key changes:
           - Header now has left group + marks badge
           - Multi badge injected by JS when multi===true
           - options-list role changes for multi
           - explanation-box unchanged
      ══════════════════════════════════════ -->
      <div
        class="question-card"
        id="question-card"
        role="region"
        aria-label="প্রশ্ন"
        hidden
      >

        <!-- Question header row -->
        <div class="question-card__header">

          <!-- Left: question badge + optional multi badge -->
          <div class="question-card__header-left">
            <div class="question-badge" id="question-badge" aria-hidden="true">
              প্রশ্ন <span id="question-number">১</span>
            </div>

            <!--
              MULTI BADGE — shown/hidden by quiz-engine.js
              Visible when question.multi === true
            -->
            <span
              class="badge-multi"
              id="badge-multi"
              aria-label="বহু সঠিক উত্তর প্রশ্ন"
              hidden
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 11 12 14 22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5
                         a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
              বহু সঠিক
            </span>

            <!--
              DIFFICULTY BADGE — shown/hidden by quiz-engine.js
              Classes: badge-difficulty--easy / --medium / --hard
            -->
            <span
              class="badge-difficulty"
              id="badge-difficulty"
              hidden
            ></span>
          </div>

          <!--
            Right: Marks badge
            JS adds class "is-multi" when multi===true
            which hides +১/−০.২৫ and shows +২ logic
          -->
          <div class="question-marks-badge" id="question-marks-badge"
               aria-label="নম্বর বণ্টন">
            <!-- Single correct marks (default visible) -->
            <span class="mark-correct">+১</span>
            <span class="mark-wrong">−০.২৫</span>
            <!-- Multi correct marks (hidden until JS adds is-multi) -->
            <span class="mark-multi" aria-label="বহু সঠিক: সর্বোচ্চ দুই নম্বর">
              +২ / আংশিক
            </span>
          </div>
        </div>

        <!--
          Question meta line (unit / type / difficulty)
          Injected and shown by quiz-engine.js
          Hidden if no meta available
        -->
        <div class="question-meta" id="question-meta" hidden>
          <!-- e.g. <span class="question-meta__tag">unit: 05-one-word-substitution</span> -->
        </div>

        <!-- Question text -->
        <div
          class="question-text"
          id="question-text"
          role="heading"
          aria-level="2"
        >
          <!-- Injected by quiz-engine.js -->
        </div>

        <!--
          OPTIONS LIST
          ─────────────────────────────────────────
          For SINGLE correct (default):
            role="radiogroup"
            aria-label="উত্তর বিকল্প"
            Contains <label> with <input type="radio">

          For MULTI correct (question.multi === true):
            role="group"
            aria-label="উত্তর বিকল্প (একাধিক সঠিক)"
            Contains <label> with <input type="checkbox">

          quiz-engine.js sets role + aria-label + input type
          ─────────────────────────────────────────
        -->
        <div
          class="options-list"
          id="options-list"
          role="radiogroup"
          aria-label="উত্তর বিকল্প"
        >
          <!--
            Structure injected by renderOptions() in quiz-engine.js:

            FOR SINGLE:
            <label class="option-label" data-index="0">
              <input type="radio" name="q-<id>" value="0" />
              <span class="option-text">Option text</span>
            </label>

            FOR MULTI (multi===true):
            <p class="multi-warning">...</p>   ← warning first
            <label class="option-label" data-index="0">
              <input type="checkbox" name="q-<id>" value="0" />
              <span class="option-text">Option text</span>
            </label>

            userAnswers keyed by question.id (STRING):
              Single: userAnswers["eg-01-001"] = 2
              Multi:  userAnswers["eg-01-004"] = [1, 2]
          -->
        </div>

        <!-- Explanation box (shown in review mode) -->
        <div
          class="explanation-box"
          id="explanation-box"
          aria-live="polite"
          hidden
        >
          <div class="explanation-box__header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8"  x2="12" y2="8"/>
              <line x1="12" y1="12" x2="12" y2="16"/>
            </svg>
            <strong>ব্যাখ্যা</strong>
          </div>
          <p class="explanation-box__text" id="explanation-text"></p>

          <!--
            MULTI SCORE BREAKDOWN (review mode only)
            Shown by quiz-engine.js when reviewing multi questions
            Example content injected by JS:
            <div class="score-multi">
              <span class="partial-score">আংশিক: ১.৩৩ নম্বর</span>
              (৩টির মধ্যে ২টি সঠিক)
            </div>
          -->
          <div class="score-multi" id="multi-score-breakdown" hidden></div>
        </div>

      </div><!-- /.question-card -->

      <!-- ========== NAVIGATION BAR ========== -->
      <div
        class="quiz-nav"
        id="quiz-nav"
        role="navigation"
        aria-label="প্রশ্ন নেভিগেশন"
        hidden
      >

        <!-- Previous -->
        <button
          class="nav-btn nav-btn--prev"
          id="btn-prev"
          type="button"
          aria-label="আগের প্রশ্ন"
          disabled
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          আগের
        </button>

        <!-- Center: Submit (last question) -->
        <button
          class="nav-btn nav-btn--submit"
          id="btn-submit"
          type="button"
          aria-label="কুইজ জমা দিন"
          hidden
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          জমা দিন
        </button>

        <!-- Center: Question counter -->
        <div class="nav-counter" id="nav-counter" aria-hidden="true">
          <span id="nav-current">১</span>
          <span class="nav-counter__sep">/</span>
          <span id="nav-total">০</span>
        </div>

        <!-- Next -->
        <button
          class="nav-btn nav-btn--next"
          id="btn-next"
          type="button"
          aria-label="পরবর্তী প্রশ্ন"
        >
          পরবর্তী
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>

      </div><!-- /.quiz-nav -->

    </main><!-- /.quiz-main -->

  </div><!-- /.quiz-layout -->

  <!-- ═══════════════════════════════════════════
       SUBMIT CONFIRMATION DIALOG
       Updated: shows multi question count
  ═══════════════════════════════════════════ -->
  <div
    class="confirm-overlay"
    id="confirm-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    hidden
  >
    <div class="confirm-box" id="confirm-box">

      <div class="confirm-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
          stroke="#f59e0b" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94
                   a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9"  x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>

      <h2 class="confirm-title" id="confirm-title">
        কুইজ জমা দিবেন?
      </h2>

      <!--
        CONFIRM STATS — injected by quiz-engine.js
        New format includes multi question breakdown:

        <div class="confirm-stats-row">
          <span>উত্তর দেওয়া হয়েছে</span>
          <span class="confirm-answered-count">১৫</span>
        </div>
        <div class="confirm-stats-row">
          <span>উত্তর দেওয়া হয়নি</span>
          <span class="confirm-unanswered-count">৫</span>
        </div>
        <div class="confirm-stats-row">
          <span>বহু-সঠিক প্রশ্ন</span>
          <span class="confirm-multi-count">৩</span>
        </div>
        <div class="confirm-stats-row">
          <span>মোট প্রশ্ন</span>
          <strong>২০</strong>
        </div>
      -->
      <div class="confirm-stats" id="confirm-stats">
        <!-- Injected by quiz-engine.js -->
      </div>

      <p class="confirm-note">
        জমা দেওয়ার পরে উত্তর পরিবর্তন করা যাবে না।
      </p>

      <div class="confirm-actions">
        <button
          class="btn btn-cancel"
          id="confirm-cancel-btn"
          type="button"
        >
          বাতিল
        </button>
        <button
          class="btn btn-confirm-submit"
          id="confirm-submit-btn"
          type="button"
        >
          হ্যাঁ, জমা দিন
        </button>
      </div>

    </div>
  </div><!-- /.confirm-overlay -->

  <!-- ========== SCRIPTS ========== -->
  <!--
    Load order:
    1. quiz-storage.js  — localStorage helpers (try-catch wrapped)
    2. quiz-scorer.js   — scoring logic (multi + single)
    3. quiz-engine.js   — UI + question rendering + answer capture
    quiz-loader.js is called from quiz-engine.js internally
  -->
  <script src="js/quiz-storage.js"></script>
  <script src="js/quiz-scorer.js"></script>
  <script src="js/quiz-engine.js"></script>

</body>
</html>
