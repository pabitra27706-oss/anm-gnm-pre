<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>কাস্টম কুইজ — WB ANM GNM 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --pink: #e91e63; --pink-light: #fce4ec; --pink-dark: #c2185b;
      --green: #4caf50; --green-light: #e8f5e9;
      --red: #f44336; --red-light: #ffebee;
      --orange: #ff9800; --blue: #2196f3; --blue-light: #e3f2fd;
      --gray-bg: #f5f5f5; --gray-border: #e0e0e0; --gray-text: #757575;
      --dark: #212121; --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 16px; --radius-sm: 12px;
    }
    body { font-family: 'Segoe UI', system-ui, 'Noto Sans Bengali', sans-serif; background: var(--gray-bg); color: var(--dark); overflow-x: hidden; }
    .quiz-header { position: sticky; top: 0; background: white; border-bottom: 1px solid var(--gray-border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; box-shadow: var(--card-shadow); }
    .header-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .exit-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--pink-light); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
    .exit-btn svg { width: 18px; height: 18px; stroke: var(--pink); stroke-width: 2; }
    .title-wrap { flex: 1; min-width: 0; }
    .quiz-title { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quiz-sub { font-size: 0.7rem; color: var(--gray-text); }
    .timer { background: var(--pink-light); padding: 5px 12px; border-radius: 30px; font-weight: 700; color: var(--pink-dark); display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }
    .timer svg { width: 14px; height: 14px; stroke: var(--pink-dark); stroke-width: 2; }
    .progress-row { background: white; padding: 8px 16px; border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .progress-bar-container { flex: 1; height: 5px; background: var(--gray-border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--pink-dark)); width: 0%; transition: width 0.2s; }
    .question-counter { font-size: 0.73rem; font-weight: 600; background: var(--gray-bg); padding: 4px 10px; border-radius: 20px; }
    .palette-toggle { background: var(--blue-light); border: none; border-radius: 30px; padding: 5px 12px; font-size: 0.73rem; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .palette-toggle svg { width: 14px; height: 14px; stroke: var(--blue); stroke-width: 2; }
    .swipe-container { overflow: hidden; touch-action: pan-y pinch-zoom; }
    .question-swipe-area { padding: 16px; transition: transform 0.2s ease-out; }
    .question-card { background: white; border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 18px; margin-bottom: 16px; }
    .meta-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
    .badge { font-size: 0.68rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .badge-subject { background: var(--pink-light); color: var(--pink-dark); }
    .badge-unit { background: var(--blue-light); color: var(--blue); }
    .badge-type { background: #f3e5f5; color: #7b1fa2; }
    .badge-easy { background: var(--green-light); color: var(--green); }
    .badge-medium { background: #fff3e0; color: var(--orange); }
    .badge-hard { background: var(--red-light); color: var(--red); }
    .badge-multi { background: #1976d2; color: white; display: inline-flex; align-items: center; gap: 3px; font-size: 0.65rem; }
    .badge-multi svg { width: 11px; height: 11px; stroke: white; stroke-width: 2.5; }
    .question-text { font-size: 1.05rem; line-height: 1.5; font-weight: 600; margin-bottom: 18px; }
    .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .option { background: white; border: 2px solid var(--gray-border); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
    .option-letter { width: 30px; height: 30px; background: var(--gray-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; color: var(--gray-text); }
    .option-text { flex: 1; font-size: 0.92rem; }
    .option.selected { border-color: var(--pink); background: var(--pink-light); }
    .option.selected .option-letter { background: var(--pink); color: white; }
    .option-checkbox { width: 18px; height: 18px; accent-color: var(--pink); margin-right: 6px; cursor: pointer; }
    .multi-warning { background: #e3f2fd; border-left: 4px solid #1976d2; border-radius: 8px; padding: 8px 12px; font-size: 0.72rem; color: #1565c0; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .multi-warning svg { width: 14px; height: 14px; stroke: #1565c0; }
    .nav-buttons { display: flex; gap: 12px; margin: 8px 0 20px; }
    .nav-btn { flex: 1; padding: 11px; border-radius: 40px; font-weight: 700; background: white; border: 1.5px solid var(--gray-border); cursor: pointer; font-size: 0.88rem; }
    .nav-btn-primary { background: linear-gradient(135deg, var(--pink), var(--pink-dark)); color: white; border: none; }
    .nav-btn:disabled { opacity: 0.5; }
    .swipe-hint { text-align: center; font-size: 0.68rem; color: var(--gray-text); margin: 8px 0; display: flex; justify-content: center; gap: 8px; align-items: center; }
    .swipe-hint svg { width: 12px; height: 12px; stroke: var(--gray-text); stroke-width: 2; }
    .palette-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; visibility: hidden; opacity: 0; transition: 0.2s; display: flex; align-items: flex-end; }
    .palette-overlay.open { visibility: visible; opacity: 1; }
    .palette-drawer { background: white; width: 100%; max-height: 70vh; border-radius: 24px 24px 0 0; padding: 20px; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s; }
    .palette-overlay.open .palette-drawer { transform: translateY(0); }
    .palette-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 700; font-size: 0.95rem; }
    .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
    .palette-btn { aspect-ratio: 1; border: 1.5px solid var(--gray-border); background: white; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .palette-btn.answered { background: var(--pink-light); border-color: var(--pink); color: var(--pink-dark); }
    .palette-btn.current { background: var(--pink); border-color: var(--pink); color: white; }
    .close-palette { background: none; border: none; font-size: 1.5rem; cursor: pointer; line-height: 1; }
    .result-container { padding: 16px; display: none; }
    .result-card, .improvement-card, .subject-breakdown { background: white; border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 18px; margin-bottom: 16px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .stat-item { text-align: center; background: var(--gray-bg); border-radius: var(--radius-sm); padding: 10px; }
    .stat-value { font-size: 1.6rem; font-weight: 800; }
    .stat-value.correct { color: var(--green); }
    .stat-value.wrong { color: var(--red); }
    .stat-value.skipped { color: var(--gray-text); }
    .breakdown-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--gray-border); font-size: 0.85rem; }
    .improvement-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 0.85rem; }
    .improvement-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
    .improvement-icon.improved { background: var(--green-light); color: var(--green); }
    .improvement-icon.same { background: #fff3e0; color: var(--orange); }
    .improvement-icon.new-wrong { background: var(--red-light); color: var(--red); }
    .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .action-btn { padding: 12px; border-radius: 40px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.88rem; }
    .action-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; }
    .action-btn-primary { background: linear-gradient(135deg, var(--pink), var(--pink-dark)); color: white; }
    .action-btn-secondary { background: white; border: 1.5px solid var(--gray-border); color: var(--dark); }
    .action-btn-wrong { background: linear-gradient(135deg, var(--red), #c62828); color: white; }
    .history-saved-banner { display: flex; align-items: center; gap: 10px; background: var(--green-light); border-radius: 10px; padding: 10px; margin-top: 14px; color: #2e7d32; font-weight: 600; font-size: 0.8rem; }
    .history-saved-banner svg { width: 16px; height: 16px; stroke: #2e7d32; }
    .loading-state, .error-state { text-align: center; padding: 60px 20px; background: white; border-radius: var(--radius); margin: 20px; }

    /* NEW: Review section styles */
    .review-section { margin-top: 20px; }
    .review-toggle { width: 100%; padding: 12px; background: linear-gradient(135deg, #2196f3, #1976d2); color: white; border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; margin-bottom: 16px; font-size: 0.9rem; }
    .review-list { display: none; gap: 16px; flex-direction: column; }
    .review-list.open { display: flex; }
    .review-item { background: white; border-radius: var(--radius); padding: 16px; border-left: 6px solid; box-shadow: var(--card-shadow); }
    .review-item.correct { border-left-color: var(--green); }
    .review-item.wrong { border-left-color: var(--red); }
    .review-item.partial { border-left-color: var(--orange); }
    .review-item.skipped { border-left-color: var(--gray-text); }
    .review-question { font-weight: 600; margin-bottom: 12px; font-size: 0.95rem; }
    .review-answer-row { display: flex; gap: 8px; margin-top: 8px; font-size: 0.85rem; flex-wrap: wrap; }
    .review-label { font-weight: 600; color: var(--gray-text); min-width: 70px; }
    .review-correct { color: var(--green); background: var(--green-light); padding: 2px 8px; border-radius: 4px; }
    .review-user-wrong { color: var(--red); background: var(--red-light); padding: 2px 8px; border-radius: 4px; }
    .review-user-correct { color: var(--green); background: var(--green-light); padding: 2px 8px; border-radius: 4px; }
    .review-explanation { margin-top: 10px; font-size: 0.8rem; color: var(--gray-text); border-top: 1px dashed var(--gray-border); padding-top: 8px; }

    @media (max-width: 480px) { .question-text { font-size: 0.98rem; } .option { padding: 10px 12px; } .option-checkbox { width: 16px; height: 16px; } }
  </style>
</head>
<body>

<header class="quiz-header">
  <div class="header-left">
    <button class="exit-btn" id="exitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="title-wrap"><div class="quiz-title" id="headerTitle">কাস্টম কুইজ</div><div class="quiz-sub" id="headerSubtitle">প্রশ্ন লোড হচ্ছে...</div></div>
  </div>
  <div class="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="timerText">০০:০০</span></div>
</header>

<div class="progress-row">
  <div class="progress-bar-container"><div class="progress-fill" id="progressFill"></div></div>
  <div class="question-counter" id="questionCounter">০/০</div>
  <button class="palette-toggle" id="paletteToggleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>তালিকা</button>
</div>

<div class="swipe-container" id="swipeContainer">
  <div class="question-swipe-area" id="questionSwipeArea"></div>
</div>

<div class="palette-overlay" id="paletteOverlay">
  <div class="palette-drawer">
    <div class="palette-header"><span>📌 সব প্রশ্ন</span><button class="close-palette" id="closePaletteBtn">&times;</button></div>
    <div class="palette-grid" id="paletteGrid"></div>
  </div>
</div>

<div id="resultContainer" class="result-container"></div>
<div id="loadingState" class="loading-state"><div>⏳ প্রশ্ন লোড হচ্ছে...</div></div>

<script src="./js/filter-history.js"></script>
<script>
(function(){
  'use strict';
  function toBengali(num) { let bn=['০','১','২','৩','৪','৫','৬','৭','৮','৯']; return String(num).replace(/[0-9]/g, d=>bn[parseInt(d)]); }
  function formatTime(sec) { let m=Math.floor(sec/60), s=sec%60; return toBengali(String(m).padStart(2,'0'))+':'+toBengali(String(s).padStart(2,'0')); }
  
  let questions=[], userAnswers={}, currentIndex=0, startTime=Date.now(), timerInterval=null, quizSubmitted=false;
  const SUBJECT_BN={'life-science':'জীবন বিজ্ঞান','physical-science':'ভৌত বিজ্ঞান','mathematics':'গণিত','general-knowledge':'সাধারণ জ্ঞান','logical-reasoning':'যুক্তিবিদ্যা','basic-english':'ইংরেজি'};
  const UNIT_BN={'01-cell-structure-functions':'কোষের গঠন','02-tissues':'কলা','03-digestive-system':'পাচনতন্ত্র','04-respiratory-system':'শ্বসনতন্ত্র','05-circulatory-system':'রক্ত সংবহন','06-excretory-system':'রেচনতন্ত্র'};
  
  function getUnitBn(u){ return UNIT_BN[u] || u?.replace(/-/g,' ') || ''; }
  function getQid(q){ return q.id; }
  
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }
  
  function evaluateSingle(q, ans){
    if(ans===null) return 'skipped';
    if(q.multi===true){
      let correctSet=new Set(Array.isArray(q.answer)?q.answer:[q.answer]);
      let userSet=new Set(Array.isArray(ans)?ans:[]);
      let hasWrong=false; userSet.forEach(s=>{ if(!correctSet.has(s)) hasWrong=true; });
      if(hasWrong) return 'wrong';
      let correctCount=0; userSet.forEach(s=>{ if(correctSet.has(s)) correctCount++; });
      if(correctCount===correctSet.size) return 'correct';
      if(correctCount>0) return 'partial';
      return 'wrong';
    }else{ let correct=Array.isArray(q.answer)?q.answer[0]:q.answer; return ans===correct?'correct':'wrong'; }
  }
  
  function loadQuestions(){
    try{ let qs=sessionStorage.getItem('filter_quiz_questions'); if(!qs) throw new Error(); questions=JSON.parse(qs); if(!questions.length) throw new Error(); userAnswers={}; questions.forEach(q=>{ userAnswers[getQid(q)]=null; }); return true; }catch(e){ return false; }
  }
  
  function renderCurrentQuestion(){
    if(!questions.length||quizSubmitted) return;
    let q=questions[currentIndex], qid=getQid(q), selectedVal=userAnswers[qid], isMulti=q.multi===true;
    let html=`<div class="question-card"><div class="meta-badges">`;
    if(q.subject) html+=`<span class="badge badge-subject">${SUBJECT_BN[q.subject]||q.subject}</span>`;
    if(q.unit) html+=`<span class="badge badge-unit">${getUnitBn(q.unit)}</span>`;
    if(q.type) html+=`<span class="badge badge-type">${q.type==='theory'?'তত্ত্ব':q.type==='numerical'?'গাণিতিক':q.type}</span>`;
    if(q.difficulty) html+=`<span class="badge badge-${q.difficulty}">${q.difficulty==='easy'?'সহজ':q.difficulty==='medium'?'মাঝারি':'কঠিন'}</span>`;
    if(isMulti) html+=`<span class="badge badge-multi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> বহু সঠিক</span>`;
    html+=`</div><div class="question-text">${escapeHtml(q.question)}</div>`;
    if(isMulti) html+=`<div class="multi-warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 8 12 12 16 12"/></svg> একাধিক উত্তর সঠিক হতে পারে। সঠিক সব উত্তর নির্বাচন করুন।</div>`;
    html+=`<div class="options-list" id="optionsList">`;
    let letters=['ক','খ','গ','ঘ','ঙ'];
    for(let i=0;i<q.options.length;i++){
      let isSelected=false;
      if(isMulti) isSelected=Array.isArray(selectedVal)&&selectedVal.includes(i);
      else isSelected=(selectedVal===i);
      let selectedClass=isSelected?' selected':'';
      if(isMulti){
        html+=`<div class="option${selectedClass}" data-opt-index="${i}"><input type="checkbox" class="option-checkbox" ${isSelected?'checked':''}><div class="option-letter">${letters[i]}</div><div class="option-text">${escapeHtml(q.options[i])}</div></div>`;
      } else {
        html+=`<div class="option${selectedClass}" data-opt-index="${i}"><div class="option-letter">${letters[i]}</div><div class="option-text">${escapeHtml(q.options[i])}</div></div>`;
      }
    }
    html+=`</div></div><div class="nav-buttons">`;
    html+=`<button class="nav-btn" id="prevBtn" ${currentIndex===0?'disabled':''}>◀ আগের</button>`;
    if(currentIndex===questions.length-1) html+=`<button class="nav-btn nav-btn-primary" id="submitQuizBtn">✅ জমা দিন</button>`;
    else html+=`<button class="nav-btn nav-btn-primary" id="nextBtn">পরবর্তী ▶</button>`;
    html+=`</div><div class="swipe-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> সোয়াইপ করে প্রশ্ন পরিবর্তন <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>`;
    document.getElementById('questionSwipeArea').innerHTML=html;
    document.querySelectorAll('.option').forEach(opt=>{
      let idx=parseInt(opt.dataset.optIndex);
      if(isMulti){
        let chk=opt.querySelector('.option-checkbox');
        opt.addEventListener('click',(e)=>{ if(e.target!==chk) chk.checked=!chk.checked; if(!quizSubmitted) handleMultiSelection(idx,chk.checked); });
        chk.addEventListener('change',(e)=>{ e.stopPropagation(); if(!quizSubmitted) handleMultiSelection(idx,chk.checked); });
      } else {
        opt.addEventListener('click',()=>{ if(!quizSubmitted) handleSingleSelection(idx); });
      }
    });
    let prevBtn=document.getElementById('prevBtn'); if(prevBtn) prevBtn.addEventListener('click',()=>navigateQuestion(-1));
    let nextBtn=document.getElementById('nextBtn'); if(nextBtn) nextBtn.addEventListener('click',()=>navigateQuestion(1));
    let submitBtn=document.getElementById('submitQuizBtn'); if(submitBtn) submitBtn.addEventListener('click',()=>submitQuiz());
    updateProgressAndCounter(); updatePalette();
  }
  
  function handleSingleSelection(idx){ let q=questions[currentIndex], qid=getQid(q); userAnswers[qid]=idx; renderCurrentQuestion(); }
  function handleMultiSelection(idx,checked){ let q=questions[currentIndex], qid=getQid(q), cur=userAnswers[qid]; let arr=Array.isArray(cur)?[...cur]:[]; if(checked){ if(!arr.includes(idx)) arr.push(idx); } else { arr=arr.filter(i=>i!==idx); } userAnswers[qid]=arr.length?arr:null; renderCurrentQuestion(); }
  function navigateQuestion(delta){ let newIdx=currentIndex+delta; if(newIdx>=0 && newIdx<questions.length){ currentIndex=newIdx; renderCurrentQuestion(); } }
  
  let touchStartX=0;
  function initSwipe(){ let area=document.getElementById('questionSwipeArea'); if(!area) return; area.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; }); area.addEventListener('touchend',e=>{ if(!touchStartX) return; let diff=e.changedTouches[0].clientX-touchStartX; if(Math.abs(diff)>50){ if(diff>0 && currentIndex>0) navigateQuestion(-1); else if(diff<0 && currentIndex<questions.length-1) navigateQuestion(1); } touchStartX=0; }); }
  
  function updateProgressAndCounter(){ let answered=0; questions.forEach(q=>{ if(userAnswers[getQid(q)]!==null) answered++; }); let percent=(answered/questions.length)*100; document.getElementById('progressFill').style.width=percent+'%'; document.getElementById('questionCounter').innerText=`${toBengali(currentIndex+1)}/${toBengali(questions.length)} (উত্তর: ${toBengali(answered)})`; document.getElementById('headerSubtitle').innerText=`${toBengali(questions.length)} প্রশ্ন • উত্তর ${toBengali(answered)}টি`; }
  
  function updatePalette(){ let grid=document.getElementById('paletteGrid'); if(!grid) return; grid.innerHTML=''; for(let i=0;i<questions.length;i++){ let q=questions[i], answered=userAnswers[getQid(q)]!==null; let btn=document.createElement('button'); btn.textContent=toBengali(i+1); btn.classList.add('palette-btn'); if(answered) btn.classList.add('answered'); if(i===currentIndex) btn.classList.add('current'); btn.addEventListener('click',()=>{ currentIndex=i; renderCurrentQuestion(); closePalette(); }); grid.appendChild(btn); } }
  function openPalette(){ document.getElementById('paletteOverlay').classList.add('open'); }
  function closePalette(){ document.getElementById('paletteOverlay').classList.remove('open'); }
  
  function submitQuiz(){
    if(quizSubmitted) return;
    quizSubmitted=true; if(timerInterval) clearInterval(timerInterval);
    let correct=0,wrong=0,partial=0,skipped=0,subjectStats={},wrongQuestions=[];
    for(let q of questions){
      let ans=userAnswers[getQid(q)];
      let res=evaluateSingle(q,ans);
      if(res==='correct') correct++; else if(res==='partial') partial++; else if(res==='wrong') wrong++; else skipped++;
      let sub=q.subject||'unknown';
      if(!subjectStats[sub]) subjectStats[sub]={total:0,correct:0};
      subjectStats[sub].total++;
      if(res==='correct') subjectStats[sub].correct++;
      if(res==='wrong') wrongQuestions.push(q);
    }
    let total=questions.length, percentage=Math.round((correct/total)*100);
    if(window.FilterHistory) try{ window.FilterHistory.saveQuizResults(questions,userAnswers); }catch(e){}
    showResultScreen({correct,wrong,partial,skipped,total,percentage,subjectStats,wrongQuestions});
  }
  
  // NEW: Populate review list with all questions, answers, explanations
  function populateReviewList(questions, userAnswers) {
    const reviewList = document.getElementById('reviewList');
    if (!reviewList) return;
    reviewList.innerHTML = '';
    const letters = ['ক', 'খ', 'গ', 'ঘ', 'ঙ'];
    questions.forEach((q, idx) => {
      const qid = q.id;
      const userAns = userAnswers[qid];
      const result = evaluateSingle(q, userAns);
      
      // Correct answer text
      let correctText = '';
      if (q.multi) {
        const correctIndices = Array.isArray(q.answer) ? q.answer : [q.answer];
        correctText = correctIndices.map(i => `${letters[i]}. ${q.options[i]}`).join('; ');
      } else {
        const correctIdx = Array.isArray(q.answer) ? q.answer[0] : q.answer;
        correctText = `${letters[correctIdx]}. ${q.options[correctIdx]}`;
      }
      
      // User answer text
      let userText = 'এড়িয়ে গেছেন';
      if (userAns !== null && userAns !== undefined) {
        if (q.multi) {
          const selected = Array.isArray(userAns) ? userAns : [];
          if (selected.length) {
            userText = selected.map(i => `${letters[i]}. ${q.options[i]}`).join('; ');
          } else {
            userText = 'কোনো উত্তর নির্বাচন করেনি';
          }
        } else {
          const idx = typeof userAns === 'number' ? userAns : null;
          userText = idx !== null ? `${letters[idx]}. ${q.options[idx]}` : 'অবৈধ উত্তর';
        }
      }
      
      const statusClass = result === 'correct' ? 'correct' : (result === 'partial' ? 'partial' : (result === 'wrong' ? 'wrong' : 'skipped'));
      const statusText = result === 'correct' ? '✓ সঠিক' : (result === 'partial' ? '⚠ আংশিক সঠিক' : (result === 'wrong' ? '✗ ভুল' : '⊘ এড়িয়ে গেছেন'));
      
      const itemDiv = document.createElement('div');
      itemDiv.className = `review-item ${statusClass}`;
      itemDiv.innerHTML = `
        <div class="review-question">${idx+1}. ${escapeHtml(q.question)}</div>
        <div class="review-answer-row">
          <span class="review-label">✅ সঠিক উত্তর:</span>
          <span class="review-correct">${escapeHtml(correctText)}</span>
        </div>
        <div class="review-answer-row">
          <span class="review-label">📝 আপনার উত্তর:</span>
          <span class="${result === 'correct' ? 'review-user-correct' : 'review-user-wrong'}">${escapeHtml(userText)}</span>
          <span style="margin-left:8px; font-weight:600;">${statusText}</span>
        </div>
        ${q.explanation ? `<div class="review-explanation">💡 ব্যাখ্যা: ${escapeHtml(q.explanation)}</div>` : ''}
      `;
      reviewList.appendChild(itemDiv);
    });
  }
  
  function showResultScreen(stats){
    document.querySelector('.progress-row').style.display='none';
    document.querySelector('.swipe-container').style.display='none';
    let resultDiv=document.getElementById('resultContainer');
    resultDiv.style.display='block';
    let subjectHtml='';
    for(let sub in stats.subjectStats){
      let data=stats.subjectStats[sub];
      let pct=data.total?Math.round((data.correct/data.total)*100):0;
      let subName=SUBJECT_BN[sub]||sub;
      let color=sub==='life-science'?'#4caf50':sub==='physical-science'?'#2196f3':sub==='mathematics'?'#ff9800':sub==='general-knowledge'?'#9c27b0':sub==='logical-reasoning'?'#00bcd4':'#e91e63';
      subjectHtml+=`<div class="breakdown-item"><span>${subName}</span><span style="color:${color};font-weight:700;">${toBengali(data.correct)}/${toBengali(data.total)} (${toBengali(pct)}%)</span></div>`;
    }
    let improvementHtml='';
    if(window.FilterHistory){
      let improved=0,stillWrong=0,newWrong=0,newCorrect=0;
      for(let q of questions){
        let prevStatus=FilterHistory.getQuestionStatus(q);
        let ans=userAnswers[getQid(q)];
        let currentRes=evaluateSingle(q,ans);
        if(prevStatus==='wrong' && currentRes==='correct') improved++;
        else if(prevStatus==='wrong' && currentRes==='wrong') stillWrong++;
        else if(prevStatus!=='wrong' && currentRes==='wrong') newWrong++;
        else if(prevStatus==='unseen' && currentRes==='correct') newCorrect++;
      }
      if(improved>0) improvementHtml+=`<div class="improvement-item"><div class="improvement-icon improved">📈</div><span>আগে ভুল ছিল, এবার সঠিক</span><span>${toBengali(improved)}টি</span></div>`;
      if(newCorrect>0) improvementHtml+=`<div class="improvement-item"><div class="improvement-icon improved">✨</div><span>নতুন প্রশ্ন সঠিক</span><span>${toBengali(newCorrect)}টি</span></div>`;
      if(stillWrong>0) improvementHtml+=`<div class="improvement-item"><div class="improvement-icon same">🔄</div><span>আগেও ভুল ছিল, এবারও ভুল</span><span>${toBengali(stillWrong)}টি</span></div>`;
      if(newWrong>0) improvementHtml+=`<div class="improvement-item"><div class="improvement-icon new-wrong">⚠️</div><span>এবার নতুন ভুল</span><span>${toBengali(newWrong)}টি</span></div>`;
    }
    let retryWrongHtml=stats.wrongQuestions.length>0?`<button class="action-btn action-btn-wrong" id="retryWrongBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>ভুল প্রশ্নগুলো আবার দিন (${toBengali(stats.wrongQuestions.length)}টি)</button>`:'';
    
    // Build result HTML including review section
    resultDiv.innerHTML=`
      <div class="result-card"><div><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="${stats.percentage>=80?'#4caf50':'#e91e63'}" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div style="font-size:1.3rem;font-weight:800;margin:10px 0;">কুইজ সম্পন্ন হয়েছে!</div>
      <div style="font-size:2.2rem;font-weight:800;color:var(--pink)">${toBengali(stats.correct)}/${toBengali(stats.total)}</div>
      <div style="margin:5px 0;">${toBengali(stats.percentage)}%</div>
      <div class="stats-grid"><div class="stat-item"><div class="stat-value correct">${toBengali(stats.correct)}</div><div>সঠিক</div></div><div class="stat-item"><div class="stat-value wrong">${toBengali(stats.wrong+stats.partial)}</div><div>ভুল/আংশিক</div></div><div class="stat-item"><div class="stat-value skipped">${toBengali(stats.skipped)}</div><div>এড়িয়ে গেছেন</div></div></div>
      <div class="history-saved-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>আপনার অগ্রগতি সেভ হয়েছে!</span></div></div>
      ${improvementHtml?`<div class="improvement-card"><div style="font-weight:700;margin-bottom:12px;">📈 উন্নতির বিশ্লেষণ</div>${improvementHtml}</div>`:''}
      <div class="subject-breakdown"><div style="font-weight:700;margin-bottom:12px;">বিষয় অনুযায়ী ফলাফল</div>${subjectHtml}</div>
      <div class="action-buttons">
        <button class="action-btn action-btn-primary" onclick="window.location.href='./filter.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>আবার ফিল্টার করুন</button>
        ${retryWrongHtml}
        <button class="action-btn action-btn-secondary" onclick="location.reload()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>একই কুইজ আবার দিন</button>
        <button class="action-btn action-btn-secondary" onclick="window.location.href='./index.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>হোম পেজে ফিরে যান</button>
      </div>
      <!-- NEW: Review section -->
      <div class="review-section">
        <button class="review-toggle" id="reviewToggleBtn">📖 সব প্রশ্নের উত্তর দেখুন</button>
        <div class="review-list" id="reviewList"></div>
      </div>
    `;
    
    // Populate review list and attach toggle event
    setTimeout(() => {
      populateReviewList(questions, userAnswers);
      const toggleBtn = document.getElementById('reviewToggleBtn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const reviewListDiv = document.getElementById('reviewList');
          if (reviewListDiv) reviewListDiv.classList.toggle('open');
        });
      }
    }, 0);
    
    let retryBtn=document.getElementById('retryWrongBtn');
    if(retryBtn && stats.wrongQuestions.length) retryBtn.addEventListener('click',()=>{ sessionStorage.setItem('filter_quiz_questions',JSON.stringify(stats.wrongQuestions)); sessionStorage.setItem('filter_quiz_config',JSON.stringify({random:true,count:'all'})); location.reload(); });
    window.scrollTo({top:0});
  }
  
  function startTimer(){ if(timerInterval) clearInterval(timerInterval); startTime=Date.now(); timerInterval=setInterval(()=>{ if(!quizSubmitted){ let elapsed=Math.floor((Date.now()-startTime)/1000); document.getElementById('timerText').innerText=formatTime(elapsed); } },1000); }
  
  function init(){
    if(!loadQuestions()){ document.getElementById('loadingState').innerHTML='<div class="error-state">⚠️ কোনো প্রশ্ন নেই। ফিল্টার পৃষ্ঠায় যান</div><button onclick="window.location.href=\'./filter.html\'" style="margin:12px auto;display:block;padding:8px 20px;background:#e91e63;color:white;border:none;border-radius:30px;">ফিল্টার পৃষ্ঠা</button>'; return; }
    document.getElementById('loadingState').style.display='none';
    startTimer(); renderCurrentQuestion(); initSwipe();
    document.getElementById('paletteToggleBtn').addEventListener('click',openPalette);
    document.getElementById('closePaletteBtn').addEventListener('click',closePalette);
    document.getElementById('paletteOverlay').addEventListener('click',(e)=>{ if(e.target===document.getElementById('paletteOverlay')) closePalette(); });
    document.getElementById('exitBtn').addEventListener('click',(e)=>{ if(!quizSubmitted){ let any=Object.values(userAnswers).some(v=>v!==null); if(any && !confirm('কুইজ অসম্পূর্ণ, প্রস্থান করবেন?')) e.preventDefault(); else window.location.href='./filter.html'; } });
  }
  init();
})();
</script>
